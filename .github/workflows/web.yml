name: web

on:
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/web

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next build` runs its own full TypeScript check — a standalone `tsc --noEmit`
      # fails on a fresh checkout because Next's ambient types (e.g. LayoutProps)
      # aren't generated until a build/dev run happens.
      - run: npm run build
        env:
          API_BASE_URL: http://localhost:8000
          INTERNAL_API_KEY: ci-placeholder
          SESSION_PASSPHRASE: ci-placeholder
          SESSION_SECRET: ci-placeholder-ci-placeholder-ci-placeholder

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      # The Vercel CLI's `pull`/`link` flow additionally calls GET /teams/{id},
      # which 403s for a project-scoped token even though the same token can
      # read the project itself fine — so we drive the git-source deploy
      # directly via the REST API instead of fighting the CLI.
      - name: Deploy to Vercel (git-source, via API)
        run: |
          set -euo pipefail
          response=$(curl -sf -X POST "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"name\":\"careeros\",\"project\":\"${VERCEL_PROJECT_ID}\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"org\":\"${{ github.repository_owner }}\",\"repo\":\"${{ github.event.repository.name }}\",\"ref\":\"${{ github.sha }}\"}}")
          dpl_id=$(echo "$response" | jq -r '.id // empty')
          if [ -z "$dpl_id" ]; then
            echo "Failed to create deployment:"; echo "$response"; exit 1
          fi
          echo "Deployment: $dpl_id"
          for i in $(seq 1 40); do
            state=$(curl -sf "https://api.vercel.com/v13/deployments/${dpl_id}?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r '.readyState')
            echo "poll $i: $state"
            if [ "$state" = "READY" ]; then exit 0; fi
            if [ "$state" = "ERROR" ] || [ "$state" = "CANCELED" ]; then echo "Deployment failed"; exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for deployment"; exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
